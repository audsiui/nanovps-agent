name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: amd64
          - target: aarch64-unknown-linux-musl
            arch: arm64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools (x86_64)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get install -y musl-tools

      - name: Install cross-compilation tools (aarch64)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu musl-tools
          # Create symlink so musl-gcc wraps aarch64 cross compiler
          sudo ln -sf /usr/bin/aarch64-linux-gnu-gcc /usr/bin/aarch64-linux-musl-gcc

      - name: Configure cross-compilation linker (aarch64)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          mkdir -p .cargo
          cat >> .cargo/config.toml << 'EOF'
          [target.aarch64-unknown-linux-musl]
          linker = "aarch64-linux-gnu-gcc"
          EOF

      - name: Build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          ARTIFACT=nanovps-agent-${TAG}-${{ matrix.arch }}
          mkdir -p /tmp/${ARTIFACT}
          cp target/${{ matrix.target }}/release/nanovps-agent /tmp/${ARTIFACT}/
          cp config.example.json /tmp/${ARTIFACT}/config.json
          tar -czf /tmp/${ARTIFACT}.tar.gz -C /tmp ${ARTIFACT}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nanovps-agent-${{ matrix.arch }}
          path: /tmp/nanovps-agent-*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: /tmp/artifacts
          merge-multiple: true

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          gh release create "${TAG}" /tmp/artifacts/*.tar.gz \
            --title "NanoVPS Agent ${TAG}" \
            --notes "## NanoVPS Agent ${TAG}

          基于 Rust 的 VPS 监控与管理 Agent。

          ### 下载

          | 架构 | 文件 |
          |---|---|
          | x86_64 (amd64) | \`nanovps-agent-${TAG}-amd64.tar.gz\` |
          | aarch64 (arm64) | \`nanovps-agent-${TAG}-arm64.tar.gz\` |

          ### 一键部署安装（推荐）

          在 Debian 13 VPS 上执行：

          \`\`\`bash
          bash <(curl -fsSL https://raw.githubusercontent.com/audsiui/nanovps-agent/master/scripts/install.sh)
          \`\`\`

          安装向导会引导你逐步完成：安装 Podman → 准备 XFS 存储 → 迁移存储 → 创建容器网络 → 下载 Agent → 配置 Agent → 创建 systemd 服务。

          ### 手动安装

          \`\`\`bash
          # 下载（以 amd64 为例）
          wget https://github.com/$(echo $GITHUB_REPOSITORY)/releases/download/${TAG}/nanovps-agent-${TAG}-amd64.tar.gz

          # 解压
          tar -xzf nanovps-agent-${TAG}-amd64.tar.gz

          # 安装二进制
          sudo cp nanovps-agent-${TAG}-amd64/nanovps-agent /usr/local/bin/
          sudo chmod +x /usr/local/bin/nanovps-agent

          # 安装配置
          sudo mkdir -p /etc/nanovps-agent
          sudo cp nanovps-agent-${TAG}-amd64/config.json /etc/nanovps-agent/
          \`\`\`

          ### 配置

          编辑 \`/etc/nanovps-agent/config.json\`：

          \`\`\`json
          {
            \"agentId\": \"your-agent-id\",
            \"serverUrl\": \"ws://127.0.0.1:3000/ws\",
            \"collectInterval\": \"10s\",
            \"podmanSocket\": \"/run/podman/podman.sock\",
            \"logMode\": \"console\",
            \"logDir\": \"./logs\"
          }
          \`\`\`

          | 字段 | 必填 | 默认值 | 说明 |
          |---|---|---|---|
          | \`agentId\` | 是 | — | 服务端分配的 Agent 标识 |
          | \`serverUrl\` | 否 | \`ws://127.0.0.1:3000/ws\` | WebSocket 服务端地址 |
          | \`collectInterval\` | 否 | \`10s\` | 指标采集间隔（10s-30s） |
          | \`podmanSocket\` | 否 | \`/run/podman/podman.sock\` | Podman Unix socket 路径 |
          | \`logMode\` | 否 | \`console\` | 日志模式（\`console\` 或 \`file\`） |
          | \`logDir\` | 否 | \`./logs\` | 日志目录（logMode=file 时生效） |

          ### systemd 服务（开机自启）

          \`\`\`ini
          [Unit]
          Description=NanoVPS Agent
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          WorkingDirectory=/etc/nanovps-agent
          ExecStart=/usr/local/bin/nanovps-agent
          Restart=always
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
          \`\`\`

          \`\`\`bash
          sudo systemctl daemon-reload
          sudo systemctl enable --now nanovps-agent
          journalctl -u nanovps-agent -f  # 查看日志
          \`\`\`

          更多详情请参考 [README](https://github.com/$(echo $GITHUB_REPOSITORY)#readme)。"